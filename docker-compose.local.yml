x-build-volumes: &build-volumes
  volumes:
    - ./backend/app:/opt/remnashop/app
    - ./backend/logs:/opt/remnashop/logs

x-common: &common
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  restart: unless-stopped
  networks:
    - remnawave-network

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: 5

x-env: &env
  env_file: .env

services:
  remnashop-db:
    image: postgres:17
    command: ["postgres", "-c", "max_connections=${DATABASE_MAX_CONNECTIONS:-200}"]
    container_name: "remnashop-db"
    hostname: remnashop-db
    <<: [*common, *logging, *env]
    environment:
      - POSTGRES_USER=${DATABASE_USER:-remnashop}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME:-remnashop}
      - TZ=UTC
    ports:
      - 127.0.0.1:6767:${DATABASE_PORT:-5432}
    volumes:
      - remnashop-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DATABASE_USER:-remnashop} -d $${DATABASE_NAME:-remnashop}"]
      interval: 3s
      timeout: 10s
      retries: 3

  remnashop-redis:
    image: valkey/valkey:9-alpine
    container_name: "remnashop-redis"
    hostname: remnashop-redis
    <<: [*common, *logging, *env]
    command: >
      sh -c '
      ARGS="--save \"\" --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction --loglevel warning";
      if [ -n "$${REDIS_PASSWORD}" ]; then
        exec valkey-server $${ARGS} --requirepass "$${REDIS_PASSWORD}";
      else
        exec valkey-server $${ARGS};
      fi'
    volumes:
      - remnashop-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping | grep PONG"]
      interval: 3s
      timeout: 10s
      retries: 3

  remnashop:
    container_name: "remnashop-local"
    hostname: remnashop
    build:
      context: .
      dockerfile: Dockerfile.local
    <<: [*common, *logging, *env]
    volumes:
      - ./backend/app:/opt/remnashop/app
      - ./backend/logs:/opt/remnashop/logs
      - remnashop-media-data:/opt/remnashop/media
    command: ["api"]
    ports:
      - 127.0.0.1:5000:${APP_PORT:-5000}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:$${APP_PORT:-5000}/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      # a first start on an old-version database migrates it before serving
      start_period: 600s
    depends_on:
      remnashop-db:
        condition: service_healthy
      remnashop-redis:
        condition: service_healthy

  # optional dashboard-only api: COMPOSE_PROFILES=admin-api
  remnashop-admin-api:
    container_name: "remnashop-admin-api-local"
    hostname: remnashop-admin-api
    profiles: ["admin-api"]
    build:
      context: .
      dockerfile: Dockerfile.local
    <<: [*common, *logging, *env]
    environment:
      APP_INSTANCE_NAME: "admin"
    volumes:
      - ./backend/app:/opt/remnashop/app
      - ./backend/logs:/opt/remnashop/logs
      - remnashop-media-data:/opt/remnashop/media
    command: ["api"]
    ports:
      - 127.0.0.1:${ADMIN_API_PORT:-5002}:${APP_PORT:-5000}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:$${APP_PORT:-5000}/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      remnashop:
        condition: service_healthy

  remnashop-telegram:
    container_name: "remnashop-telegram-local"
    hostname: remnashop-telegram
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        UV_EXTRA: telegram
    <<: [*common, *logging, *env]
    volumes:
      - ./backend/app:/opt/remnashop/app
      - ./backend/logs:/opt/remnashop/logs
      - remnashop-media-data:/opt/remnashop/media
    command: ["telegram"]
    ports:
      - 127.0.0.1:${BOT_PORT:-5001}:${BOT_PORT:-5001}
    depends_on:
      remnashop:
        condition: service_healthy

  remnashop-worker:
    container_name: "remnashop-worker-local"
    hostname: remnashop-worker
    build:
      context: .
      dockerfile: Dockerfile.local
    <<: [*common, *logging, *env]
    volumes:
      - ./backend/app:/opt/remnashop/app
      - ./backend/logs:/opt/remnashop/logs
      - remnashop-media-data:/opt/remnashop/media
    command: ["worker"]
    ports:
      - 127.0.0.1:${APP_METRICS_PORT:-9110}:${APP_METRICS_PORT:-9110}
    depends_on:
      remnashop:
        condition: service_healthy

  remnashop-scheduler:
    container_name: "remnashop-scheduler-local"
    hostname: remnashop-scheduler
    build:
      context: .
      dockerfile: Dockerfile.local
    <<: [*build-volumes, *common, *logging, *env]
    command: ["scheduler"]
    depends_on:
      remnashop:
        condition: service_healthy

  remnashop-frontend:
    container_name: "remnashop-frontend-local"
    hostname: remnashop-frontend
    image: node:22-alpine
    working_dir: /opt/frontend
    volumes:
      - ./frontend:/opt/frontend
      - /opt/frontend/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://remnashop:5000
      APP_DOMAIN: ${APP_DOMAIN:-}
    restart: unless-stopped
    networks:
      - remnawave-network
    ports:
      - 5173:5173
    depends_on:
      remnashop:
        condition: service_healthy

networks:
  remnawave-network:
    name: remnawave-network
    driver: bridge
    external: false

volumes:
  remnashop-db-data:
    name: remnashop-db-data
    driver: local
    external: false
  remnashop-redis-data:
    name: remnashop-redis-data
    driver: local
    external: false
  remnashop-media-data:
    name: remnashop-media-data
    driver: local
    external: false
