x-build: &build
  image: ghcr.io/snoups/remnashop:latest

x-common: &common
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  restart: unless-stopped
  networks:
    - remnawave-network

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: 5

x-env: &env
  env_file: .env

services:
  remnashop-db:
    image: postgres:17
    container_name: "remnashop-db"
    hostname: remnashop-db
    <<: [*common, *logging, *env]
    environment:
      - POSTGRES_USER=${DATABASE_USER:-remnashop}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME:-remnashop}
      - TZ=UTC
    volumes:
      - remnashop-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DATABASE_USER:-remnashop} -d $${DATABASE_NAME:-remnashop}"]
      interval: 3s
      timeout: 10s
      retries: 3

  remnashop-redis:
    image: valkey/valkey:9-alpine
    container_name: "remnashop-redis"
    hostname: remnashop-redis
    <<: [*common, *logging, *env]
    command: >
      sh -c '
      ARGS="--save \"\" --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru --loglevel warning";
      if [ -n "$${REDIS_PASSWORD}" ]; then
        exec valkey-server $${ARGS} --requirepass "$${REDIS_PASSWORD}";
      else
        exec valkey-server $${ARGS};
      fi'
    volumes:
      - remnashop-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli $${REDIS_PASSWORD:+-a \"$REDIS_PASSWORD\"} ping | grep PONG"]
      interval: 3s
      timeout: 10s
      retries: 3

  remnashop-api:
    container_name: "remnashop-api"
    hostname: remnashop-api
    <<: [*build, *common, *logging, *env]
    command: ["api"]
    volumes:
      - ./logs:/opt/remnashop/logs
      - remnashop-media-data:/opt/remnashop/media
    ports:
      - 127.0.0.1:5000:${APP_PORT:-5000}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${APP_PORT:-5000}/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      remnashop-db:
        condition: service_healthy
      remnashop-redis:
        condition: service_healthy

  remnashop-telegram:
    container_name: "remnashop-telegram"
    hostname: remnashop-telegram
    image: ghcr.io/snoups/remnashop:latest-telegram
    <<: [*common, *logging, *env]
    command: ["telegram"]
    volumes:
      - ./logs:/opt/remnashop/logs
      - remnashop-media-data:/opt/remnashop/media
    ports:
      - 127.0.0.1:${BOT_PORT:-5001}:${BOT_PORT:-5001}
    depends_on:
      remnashop-api:
        condition: service_healthy

  remnashop-worker:
    container_name: "remnashop-worker"
    hostname: remnashop-worker
    <<: [*build, *common, *logging, *env]
    command: ["worker"]
    volumes:
      - ./logs:/opt/remnashop/logs
      - remnashop-media-data:/opt/remnashop/media
    ports:
      - 127.0.0.1:${WORKER_METRICS_PORT:-9110}:${APP_METRICS_PORT:-9110}
    depends_on:
      remnashop-api:
        condition: service_healthy

  remnashop-scheduler:
    container_name: "remnashop-scheduler"
    hostname: remnashop-scheduler
    <<: [*build, *common, *logging, *env]
    command: ["scheduler"]
    volumes:
      - ./logs:/opt/remnashop/logs
    depends_on:
      remnashop-api:
        condition: service_healthy

networks:
  remnawave-network:
    name: remnawave-network
    driver: bridge
    external: true

volumes:
  remnashop-db-data:
    name: remnashop-db-data
    driver: local
    external: false
  remnashop-redis-data:
    name: remnashop-redis-data
    driver: local
    external: false
  remnashop-media-data:
    name: remnashop-media-data
    driver: local
    external: false
