[project]
name = "remnashop"
version = "0.0.0"
description = "This is a Telegram bot for selling VPN subscriptions. It works with Remnawave"
authors = [{ name = "snoups" }]
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "uvicorn>=0.38.0",
    "fastapi>=0.120.2",
    "python-multipart>=0.0.22",
    "remnapy==3.2.1",
    #
    "dishka~=1.7.2",
    #
    "asyncpg~=0.30.0",
    "alembic~=1.16.5",
    "sqlalchemy>=2.0.0",
    "redis~=7.0.0",
    "taskiq~=0.12.1",
    "taskiq-redis~=1.2.1",
    "orjson~=3.11",
    #
    "pydantic~=2.11.0",
    "pydantic-settings~=2.11.0",
    "loguru~=0.7.3",
    "cryptography>=46.0.3",
    "authlib~=1.6.5",
    "qrcode[pil]>=8.2",
    "pyjwt>=2.13.0",
    "greenlet>=3.3.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
]

[project.optional-dependencies]
# Only the `telegram` process needs these -- pulling them into the base
# dependency set costs every other process ~85MB RSS for aiogram+aiohttp
# alone, whether or not it ever touches Telegram.
telegram = [
    "aiogram~=3.25.0",
    "aiohttp-socks>=0.10.0",
    "aiogram-dialog~=2.5.0",
    "fluentogram~=1.2.1",
]

#[tool.uv.sources]
#remnapy = { git = "https://github.com/snoups/remnapy", rev = "0680253" }

[project.urls]
homepage = "https://t.me/@remna_shop"
repository = "https://github.com/snoups/remnashop"

[dependency-groups]
dev = [
    "sqlalchemy[mypy]>=2.0.0",
    "mypy>=1.18.2",
    "ruff>=0.14.2",
    "pytest>=8.4.2",
    "watchfiles>=1.1.1",
    "ftl-extract>=0.9.0",
    "types-cachetools",
    "pytest-asyncio",
    "import-linter>=2.13",
]

[tool.ruff]
target-version = "py312"
line-length = 100
lint.select = [
    "C",
    "DTZ",
    "E",
    "F",
    "I",
    "ICN",
    "N",
    "PLC",
    "PLE",
    "Q",
    "T",
    "TID",
    "W",
    "YTT",
]
lint.ignore = ["N805"]
exclude = ["venv", ".venv", ".idea"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Autogenerated by `alembic revision --autogenerate`; long enum column
# definitions can't be wrapped without editing output that's regenerated
# wholesale on every model change (single-revision policy, see decision #12).
"app/core/db/migrations/versions/*.py" = ["E501"]
# Interactive rescue tool -- print/input are the actual interface, not debug leftovers.
"app/cli/__main__.py" = ["T201"]
"app/cli/restore_backup.py" = ["T201"]
# os.environ.setdefault(...) must run before the imports below it -- see the
# comment in the file itself for why (a transitively-imported module-level
# singleton bakes in the wrong host otherwise).
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
packages = ["app"]
plugins = ["sqlalchemy.ext.mypy.plugin", "pydantic.mypy"]
exclude = ["venv", ".venv", ".idea", "tests"]
warn_unused_configs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "fluentogram.*",
    "fluent_compiler.*",
    "remnawave.*",
    "qrcode.*",
    "remnapy.*",
]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["app.modules.*.telegram.*"]
strict_optional = false
warn_return_any = false
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true
