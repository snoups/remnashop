name: Remnashop - Dev

on:
  push:
    branches:
      - dev

permissions: {}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  docker-build:
    name: 🏗️ Build and Push Docker Image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      telegram_image_tag: ${{ steps.vars.outputs.telegram_image_tag }}
      short_sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - name: 🧾 Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🛠️ Set Up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Define Tags & Outputs
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY}"
          IMAGE_TAGS="${IMAGE_REPO}:dev,${IMAGE_REPO}:dev-${SHORT_SHA}"
          TELEGRAM_IMAGE_TAGS="${IMAGE_REPO}:dev-telegram,${IMAGE_REPO}:dev-${SHORT_SHA}-telegram"

          echo "image_tag=${IMAGE_TAGS}" >> $GITHUB_OUTPUT
          echo "telegram_image_tag=${TELEGRAM_IMAGE_TAGS}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT

          echo "✅ Tags: ${IMAGE_TAGS}"
          echo "✅ Telegram tags: ${TELEGRAM_IMAGE_TAGS}"
          echo "✅ SHA: ${SHORT_SHA}"

      - name: 🏗️ Build and Push Image (api)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.vars.outputs.image_tag }}
          build-args: |
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_COMMIT=${{ steps.vars.outputs.short_sha }}
            BUILD_TAG=dev

      - name: 🏗️ Build and Push Image (telegram)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.vars.outputs.telegram_image_tag }}
          build-args: |
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_COMMIT=${{ steps.vars.outputs.short_sha }}
            BUILD_TAG=dev
            UV_EXTRA=telegram

  release:
    name: 📦 Build and Publish Dev Artifact
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      contents: write

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHORT_SHA: ${{ needs.docker-build.outputs.short_sha }}

    steps:
      - name: 🧾 Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 📁 Archive Project Files
        run: |
          zip -r remnashop-dev.zip . \
            -x ".git/*" ".github/*" "logs/*" "*.zip" "node_modules/*"

      - name: 🧹 Remove Previous Artifact
        continue-on-error: true
        run: gh release delete-asset dev-build remnashop-dev.zip || true

      - name: ⬆️ Upload Artifact to Release
        run: gh release upload dev-build remnashop-dev.zip --clobber

      - name: 📝 Update Release Notes
        run: |
          COMMIT_URL="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')

          gh release edit dev-build --notes-file - <<EOF
          🔁 Updated development build
          🔗 [Commit]($COMMIT_URL)
          🏷️ api:
          • \`dev\`
          • \`dev-$SHORT_SHA\`
          🏷️ telegram:
          • \`dev-telegram\`
          • \`dev-$SHORT_SHA-telegram\`
          📅 Built: $DATE
          EOF
