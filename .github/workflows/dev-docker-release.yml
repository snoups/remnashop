name: Remnashop - Dev

on:
  push:
    branches:
      - dev

permissions: {}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  vars:
    name: 🏷️ Define Tags & Build Args
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      telegram_image_tag: ${{ steps.vars.outputs.telegram_image_tag }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
      build_time: ${{ steps.vars.outputs.build_time }}

    steps:
      - name: 🧾 Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🏷️ Define Tags & Outputs
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY}"

          {
            echo "image_tag<<EOF"
            echo "${IMAGE_REPO}:dev"
            echo "${IMAGE_REPO}:dev-${SHORT_SHA}"
            echo "EOF"
            echo "telegram_image_tag<<EOF"
            echo "${IMAGE_REPO}:dev-telegram"
            echo "${IMAGE_REPO}:dev-${SHORT_SHA}-telegram"
            echo "EOF"
            echo "short_sha=${SHORT_SHA}"
            echo "build_time=${BUILD_TIME}"
          } >> $GITHUB_OUTPUT

          echo "✅ SHA: ${SHORT_SHA}"

  api:
    needs: vars
    uses: ./.github/workflows/docker-image.yml
    permissions:
      contents: read
      packages: write
    with:
      variant: api
      tags: ${{ needs.vars.outputs.image_tag }}
      build-args: |
        BUILD_TIME=${{ needs.vars.outputs.build_time }}
        BUILD_BRANCH=${{ github.ref_name }}
        BUILD_COMMIT=${{ needs.vars.outputs.short_sha }}
        BUILD_TAG=dev

  telegram:
    needs: vars
    uses: ./.github/workflows/docker-image.yml
    permissions:
      contents: read
      packages: write
    with:
      variant: telegram
      tags: ${{ needs.vars.outputs.telegram_image_tag }}
      build-args: |
        BUILD_TIME=${{ needs.vars.outputs.build_time }}
        BUILD_BRANCH=${{ github.ref_name }}
        BUILD_COMMIT=${{ needs.vars.outputs.short_sha }}
        BUILD_TAG=dev
        UV_EXTRA=telegram

  release:
    name: 📦 Build and Publish Dev Artifact
    runs-on: ubuntu-latest
    needs: [vars, api, telegram]
    permissions:
      contents: write

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHORT_SHA: ${{ needs.vars.outputs.short_sha }}

    steps:
      - name: 🧾 Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 📁 Archive Project Files
        run: |
          zip -r remnashop-dev.zip . \
            -x ".git/*" ".github/*" "logs/*" "*.zip" "node_modules/*"

      - name: 🧹 Remove Previous Artifact
        continue-on-error: true
        run: gh release delete-asset dev-build remnashop-dev.zip || true

      - name: ⬆️ Upload Artifact to Release
        run: gh release upload dev-build remnashop-dev.zip --clobber

      - name: 📝 Update Release Notes
        run: |
          COMMIT_URL="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')

          gh release edit dev-build --notes-file - <<EOF
          🔁 Updated development build
          🔗 [Commit]($COMMIT_URL)
          🏷️ api:
          • \`dev\`
          • \`dev-$SHORT_SHA\`
          🏷️ telegram:
          • \`dev-telegram\`
          • \`dev-$SHORT_SHA-telegram\`
          📅 Built: $DATE
          EOF
