name: Remnashop - Release

on:
  release:
    # a full release fires both published and released; a pre-release only published,
    # and its later promotion only released
    types: [published, released]

permissions: {}

jobs:
  checks:
    if: github.event.action == 'released' || github.event.release.prerelease
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  vars:
    name: 🏷️ Define Build Args
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      build_time: ${{ steps.vars.outputs.build_time }}
      build_branch: ${{ steps.vars.outputs.build_branch }}

    steps:
      - name: 🧾 Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 🏷️ Define Build Args
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_BRANCH=$(git branch -r --contains HEAD --format='%(refname:lstrip=3)' | grep -v '^HEAD$' | head -n1)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT
          echo "build_branch=${BUILD_BRANCH:-${GITHUB_REF_NAME}}" >> $GITHUB_OUTPUT
          echo "✅ SHA: ${SHORT_SHA}"

  # a pre-release gets only its own tag: latest stays on the last full release
  api:
    needs: vars
    uses: ./.github/workflows/docker-image.yml
    permissions:
      contents: read
      packages: write
    with:
      variant: api
      tags: |
        ghcr.io/remnashop/remnashop:${{ github.ref_name }}
        ${{ !github.event.release.prerelease && 'ghcr.io/remnashop/remnashop:latest' || '' }}
      build-args: |
        BUILD_TIME=${{ needs.vars.outputs.build_time }}
        BUILD_BRANCH=${{ needs.vars.outputs.build_branch }}
        BUILD_COMMIT=${{ needs.vars.outputs.short_sha }}
        BUILD_TAG=${{ github.ref_name }}

  telegram:
    needs: vars
    uses: ./.github/workflows/docker-image.yml
    permissions:
      contents: read
      packages: write
    with:
      variant: telegram
      tags: |
        ghcr.io/remnashop/remnashop:${{ github.ref_name }}-telegram
        ${{ !github.event.release.prerelease && 'ghcr.io/remnashop/remnashop:latest-telegram' || '' }}
      build-args: |
        BUILD_TIME=${{ needs.vars.outputs.build_time }}
        BUILD_BRANCH=${{ needs.vars.outputs.build_branch }}
        BUILD_COMMIT=${{ needs.vars.outputs.short_sha }}
        BUILD_TAG=${{ github.ref_name }}
        UV_EXTRA=telegram

  release:
    runs-on: ubuntu-latest
    needs: [api, telegram]
    permissions:
      contents: write

    steps:
      - name: 🧾 Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 🔖 Get previous tag
        id: latest-tag
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          echo "previousTag=${PREVIOUS_TAG}" >> $GITHUB_OUTPUT
          echo "latestTag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: 📦 Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: false
          body: |
            # 🛍 Remnashop ${{ github.ref_name }}
            [![Telegram Group](https://img.shields.io/badge/public_group-white?style=social&logo=Telegram&logoColor=blue)](https://t.me/remna_shop)
            [![Remnawave](https://img.shields.io/badge/remnawave-white?style=social&logo=Telegram&logoColor=blue)](https://t.me/+xQs17zMzwCY1NzYy)

            ---

            - [Compare changes (${{ steps.latest-tag.outputs.previousTag }}...${{ steps.latest-tag.outputs.latestTag }})](https://github.com/remnashop/remnashop/compare/${{ steps.latest-tag.outputs.previousTag }}...${{ steps.latest-tag.outputs.latestTag }})

            ---

            ## 🐳 Docker Images

            `api` service:
            ```
            ${{ !github.event.release.prerelease && 'ghcr.io/remnashop/remnashop:latest' || '' }}
            ghcr.io/remnashop/remnashop:${{ github.ref_name }}
            ```

            `telegram` service (includes aiogram -- only this variant needs it):
            ```
            ${{ !github.event.release.prerelease && 'ghcr.io/remnashop/remnashop:latest-telegram' || '' }}
            ghcr.io/remnashop/remnashop:${{ github.ref_name }}-telegram
            ```
          draft: false
          prerelease: ${{ github.event.release.prerelease }}
